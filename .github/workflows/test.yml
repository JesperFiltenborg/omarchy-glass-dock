name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch, like Omarchy: same Qt (qmllint), Quickshell and Lua versions as
    # users run. Quickshell provides the type info qmllint checks against.
    container: archlinux:latest
    steps:
      - name: Install tools
        run: >-
          pacman -Syu --noconfirm --needed git nodejs lua qt6-declarative quickshell jq
          shellcheck shfmt stylua luacheck biome

      - uses: actions/checkout@v4

      # The checkout belongs to another uid than the container's root, and git
      # refuses to list files in it ("dubious ownership") without this.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint, static checks, unit tests, Lua tests
        env:
          LINT_STRICT: "1"
        run: scripts/test.sh

  # Pull requests are squash-merged under their title, so the title becomes the
  # commit on main: both it and the branch name must follow docs/GIT_WORKFLOW.md.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node tests/tools/conventional.mjs title "$TITLE"
      - name: Branch name follows the schema
        env:
          BRANCH: ${{ github.head_ref }}
        run: node tests/tools/conventional.mjs branch "$BRANCH"
