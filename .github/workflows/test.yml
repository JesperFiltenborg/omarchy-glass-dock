name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch, like Omarchy: same Qt (qmllint), Quickshell and Lua versions as
    # users run. Quickshell provides the type info qmllint checks against.
    container: archlinux:latest
    steps:
      - name: Install tools
        run: >-
          pacman -Syu --noconfirm --needed git nodejs lua qt6-declarative quickshell jq
          shellcheck shfmt stylua luacheck biome

      - uses: actions/checkout@v4

      # The checkout belongs to another uid than the container's root, and git
      # refuses to list files in it ("dubious ownership") without this.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint, static checks, unit tests, Lua tests
        env:
          LINT_STRICT: "1"
        run: scripts/test.sh
